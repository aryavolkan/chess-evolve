# Optimized sweep v9 — follow-up to v8 (l56gachl / amyuow5c)
#
# v8 analysis (356+35 runs):
#   - move_temperature is the dominant knob (corr +0.37). Sweet spot: 0.15-0.18.
#   - sf_fitness_weight & tournament_k never got a fair test (amyuow5c flapped
#     at 35 runs due to early-termination crash bug, now fixed in PR #54).
#   - BWR ceiling at ~0.41 suggests fitness function tuning may unlock more.
#
# Changes vs v8:
#   - Tighten move_temperature to proven [0.14, 0.22] (was [0.10, 0.40])
#   - Retry sf_fitness_weight and tournament_k (underpowered in v8)
#   - NEW: sweep games_per_individual (2 vs 4) — reduce fitness noise
#   - NEW: sweep checkmate_bonus and draw_bonus — probe fitness balance

method: bayes
metric:
  name: bench_avg_win_rate
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 60
  eta: 3

parameters:
  # Fixed (proven values from v7/v8 top clusters)
  population_size:
    value: 150
  hidden_size:
    value: 64
  mutation_rate:
    value: 0.25
  mutation_strength:
    value: 0.12
  max_generations:
    value: 250
  tournament_opponents:
    value: 10
  use_neat:
    value: true
  curriculum_stage:
    value: 2
  input_size:
    value: 389
  output_size:
    value: 384
  max_moves_per_game:
    value: 100
  eval_temperature:
    value: 0.0
  benchmark_size:
    value: 50
  sf_fitness_top_n:
    value: 50
  sf_bench_interval:
    value: 5
  transition_gens:
    value: 3
  neat_initial_connections_per_output:
    value: 1
  neat_target_species_count:
    value: 5
  immigration_rate:
    value: 0.14
  crossover_rate:
    value: 0.76
  neat_add_node_rate:
    value: 0.17
  neat_add_connection_rate:
    value: 0.25

  # Swept — tightened to proven sweet spot
  move_temperature:
    distribution: uniform
    min: 0.14
    max: 0.22

  # Swept — retry from v8 (insufficient data last time)
  sf_fitness_weight:
    distribution: uniform
    min: 0.0
    max: 0.25
  tournament_k:
    values: [2, 3, 5]

  # Swept — NEW: fitness noise reduction
  games_per_individual:
    values: [2, 4]

  # Swept — NEW: fitness function balance
  checkmate_bonus:
    values: [10, 15, 20]
  draw_bonus:
    values: [0, 1.5, 3]
