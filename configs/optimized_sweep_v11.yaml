# Optimized sweep v11 — exploit output_size=128 breakthrough
#
# v10 (31 runs, full grid): output_size=128 (factored) is the clear winner
#   - 128: mean BWR=0.244, consistently strong across configs
#   - 384: mean BWR=0.177, high variance
#   - Smaller output space lets NEAT wire topology ~38% more efficiently
#   - Other structural params: pop=150 > 250, moves=100 > 150, conns=1 > 3
#
# v11 locks in 128-output and explores the dimensions that matter with it:
#   - population_size: 150 vs 200 vs 300 (v10 said 150>250, but try 200/300)
#   - max_generations: 300 vs 500 (128 evolves faster — can it go further?)
#   - move_temperature: [0.15, 0.25] (re-sweep — optimal may shift with 128)
#   - neat_add_node_rate: [0.10, 0.25] (topology mutation may matter more now)
#   - neat_add_connection_rate: [0.15, 0.35] (ditto)
#   - neat_target_species_count: 5 vs 8 vs 12 (more species = more diversity)

method: bayes
metric:
  name: bench_avg_win_rate
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 80
  eta: 3

parameters:
  # Fixed — proven from v9/v10
  output_size:
    value: 128
  hidden_size:
    value: 64
  games_per_individual:
    value: 2
  max_moves_per_game:
    value: 100
  mutation_rate:
    value: 0.25
  mutation_strength:
    value: 0.12
  tournament_k:
    value: 3
  tournament_opponents:
    value: 10
  use_neat:
    value: true
  curriculum_stage:
    value: 2
  input_size:
    value: 389
  eval_temperature:
    value: 0.0
  benchmark_size:
    value: 50
  checkmate_bonus:
    value: 15
  draw_bonus:
    value: 1.5
  sf_fitness_weight:
    value: 0.0
  sf_fitness_top_n:
    value: 50
  sf_bench_interval:
    value: 5
  transition_gens:
    value: 3
  immigration_rate:
    value: 0.14
  crossover_rate:
    value: 0.76
  neat_initial_connections_per_output:
    value: 1

  # Swept — structural scaling
  population_size:
    values: [150, 200, 300]
  max_generations:
    values: [300, 500]

  # Swept — re-tune for 128-output topology
  move_temperature:
    distribution: uniform
    min: 0.15
    max: 0.25
  neat_add_node_rate:
    distribution: uniform
    min: 0.10
    max: 0.25
  neat_add_connection_rate:
    distribution: uniform
    min: 0.15
    max: 0.35
  neat_target_species_count:
    values: [5, 8, 12]
