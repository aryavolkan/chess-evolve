# Optimized sweep v2 — based on 7yfgqt0t analysis (36 runs)
#
# Key changes from v1:
#   - puzzle_advance_threshold: 0.50-0.60 (was 0.55-0.75, r=-0.54 — advance sooner)
#   - neat_target_species_count: fixed 5 (was 5/8/10, r=-0.30 — fewer is better)
#   - crossover_rate: 0.70-0.80 (was 0.58-0.80, narrowed to sweet spot)
#   - move_temperature: 0.12-0.20 (was 0.05-0.20, higher is better, r=+0.31)
#   - max_generations: 250 (was 500 — diminishing returns after ~200)
#   - No early termination (was hyperband@100 — killed good runs mid-curriculum)
#   - puzzle_accuracy_weight: 0.35-0.50 (narrowed upward, r=+0.29)

method: bayes
metric:
  name: bench_avg_win_rate
  goal: maximize
parameters:
  # Fixed — strong signal from prior sweeps
  population_size:
    value: 150
  hidden_size:
    value: 64
  games_per_individual:
    value: 2
  mutation_rate:
    value: 0.25
  mutation_strength:
    value: 0.12
  max_generations:
    value: 250
  tournament_k:
    value: 2
  tournament_opponents:
    value: 5
  use_neat:
    value: true
  curriculum_stage:
    value: 0
  checkmate_bonus:
    value: 15
  input_size:
    value: 389
  output_size:
    value: 384
  max_moves_per_game:
    value: 100
  eval_temperature:
    value: 0.0
  benchmark_size:
    value: 50
  draw_bonus:
    value: 1.5
  sf_fitness_weight:
    value: 0.0
  sf_fitness_top_n:
    value: 50
  sf_bench_interval:
    value: 10
  transition_gens:
    value: 3
  neat_initial_connections_per_output:
    value: 1
  neat_target_species_count:
    value: 5
  immigration_rate:
    value: 0.14

  # Swept — tightened from v1 based on correlation analysis
  crossover_rate:
    distribution: uniform
    min: 0.70
    max: 0.80
  move_temperature:
    distribution: uniform
    min: 0.12
    max: 0.20
  neat_add_node_rate:
    distribution: uniform
    min: 0.15
    max: 0.25
  neat_add_connection_rate:
    distribution: uniform
    min: 0.18
    max: 0.28
  puzzle_accuracy_weight:
    distribution: uniform
    min: 0.35
    max: 0.50
  puzzle_advance_threshold:
    distribution: uniform
    min: 0.50
    max: 0.60
