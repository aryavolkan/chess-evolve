# Optimized sweep v3 — based on 1tohqypj analysis (100 runs)
#
# Key insight: 77% of runs never reached stage 3 in 250 gens.
# The curriculum is the bottleneck, not the GA/NEAT params.
#
# Changes from v2:
#   - max_generations: 400 (was 250 — more time to clear curriculum)
#   - puzzle_advance_threshold: fixed 0.50 (was 0.50-0.60 — lower = advance sooner)
#   - move_temperature: 0.12-0.15 (was 0.12-0.20 — r=-0.43 in stage 3, lower wins)
#   - crossover_rate: fixed 0.76 (was 0.70-0.80 — sweet spot from top runs)
#   - puzzle_accuracy_weight: fixed 0.43 (was 0.35-0.50 — top-5 mean)
#   - Sweep focus: topology rates only (the remaining uncertain params)
#   - Added sf_bench_interval=5 (was 10 — more frequent benchmark signal)

method: bayes
metric:
  name: bench_avg_win_rate
  goal: maximize
parameters:
  # Fixed — locked from cumulative sweep data
  population_size:
    value: 150
  hidden_size:
    value: 64
  games_per_individual:
    value: 2
  mutation_rate:
    value: 0.25
  mutation_strength:
    value: 0.12
  max_generations:
    value: 400
  tournament_k:
    value: 2
  tournament_opponents:
    value: 5
  use_neat:
    value: true
  curriculum_stage:
    value: 0
  checkmate_bonus:
    value: 15
  input_size:
    value: 389
  output_size:
    value: 384
  max_moves_per_game:
    value: 100
  eval_temperature:
    value: 0.0
  benchmark_size:
    value: 50
  draw_bonus:
    value: 1.5
  sf_fitness_weight:
    value: 0.0
  sf_fitness_top_n:
    value: 50
  sf_bench_interval:
    value: 5
  transition_gens:
    value: 3
  neat_initial_connections_per_output:
    value: 1
  neat_target_species_count:
    value: 5
  immigration_rate:
    value: 0.14
  crossover_rate:
    value: 0.76
  puzzle_accuracy_weight:
    value: 0.43
  puzzle_advance_threshold:
    value: 0.50
  move_temperature:
    distribution: uniform
    min: 0.12
    max: 0.15

  # Swept — topology rates (remaining uncertain params)
  neat_add_node_rate:
    distribution: uniform
    min: 0.15
    max: 0.25
  neat_add_connection_rate:
    distribution: uniform
    min: 0.18
    max: 0.28
