program: train_wandb.py
method: bayes
metric:
  name: puzzle_accuracy_best
  goal: maximize
parameters:
  use_neat:
    value: true
  output_size:
    value: 384
  max_generations:
    value: 300
  max_moves_per_game:
    value: 100
  # Stage 0: puzzle-only fitness
  curriculum_stage:
    value: 0
  puzzle_max_rating:
    values: [600, 800]
  puzzle_count:
    values: [200, 500]
  puzzle_rating_step:
    value: 100
  puzzle_advance_threshold:
    value: 0.75
  puzzle_accuracy_weight:
    distribution: uniform
    min: 0.3
    max: 0.5
  puzzle_themes:
    values:
      - ["mateIn1", "fork", "pin", "hangingPiece"]
      - ["mateIn1", "fork", "pin", "hangingPiece", "skewer", "discoveredAttack"]
      - null
  curriculum_promotion_threshold:
    value: 0.80
  # Population
  population_size:
    values: [100, 200]
  # Low temperature — amplify weight signal
  move_temperature:
    distribution: uniform
    min: 0.1
    max: 0.3
  # NEAT topology mutation
  add_node_rate:
    distribution: uniform
    min: 0.10
    max: 0.25
  add_connection_rate:
    distribution: uniform
    min: 0.20
    max: 0.40
  add_node_count:
    values: [1, 2]
  add_connection_count:
    values: [3, 5]
  initial_connections_per_output:
    value: 1
  # NEAT speciation
  target_species_count:
    values: [5, 10]
  stagnation_threshold:
    values: [10, 15]
  # Weight mutation
  weight_mutate_rate:
    distribution: uniform
    min: 0.7
    max: 0.9
  weight_perturb_strength:
    distribution: uniform
    min: 0.2
    max: 0.5
  # Crossover & selection
  crossover_rate:
    distribution: uniform
    min: 0.60
    max: 0.85
  elite_fraction:
    distribution: uniform
    min: 0.05
    max: 0.15
  survival_fraction:
    distribution: uniform
    min: 0.3
    max: 0.6
  # No complexity cost — let topology grow for puzzle solving
  complexity_cost:
    value: 0.0
  benchmark_fitness_weight:
    value: 0.0
  prune_rate:
    value: 0.0
  # SF benchmark (no fitness blending, just monitoring)
  sf_fitness_weight:
    value: 0.0
  sf_bench_interval:
    value: 20
  sf_bench_games:
    value: 6
  sf_skill_level:
    value: 0
  sf_move_time:
    value: 0.05
