# Optimized sweep v5 — first sweep with all Phase 1-3 bug fixes
#
# Critical changes from v4:
#   - neat_initial_connections_per_output: 5 (was 1 — root cause of flat fitness)
#   - puzzle_advance_threshold: 0.12-0.18 (was 0.50-0.60 — unreachable)
#   - tournament_opponents: 10 (was 5 — reduce fitness noise)
#   - mercy_material_threshold: 10 (was ~12 — more decisive games)
#   - stagnation_kill_threshold: 50 (was 25 — preserve diversity longer)
#   - Bugs fixed: sf_avg_cpl written, puzzle_bench persisted, CPL=0 correct,
#     weight mutation rate correct, per-genome complexity cost
#
# Swept: topology rates + move temp (the remaining uncertain params)

method: bayes
metric:
  name: bench_avg_win_rate
  goal: maximize
parameters:
  # Fixed — locked from cumulative data + Phase 1-3 fixes
  population_size:
    value: 150
  hidden_size:
    value: 64
  games_per_individual:
    value: 2
  mutation_rate:
    value: 0.25
  mutation_strength:
    value: 0.12
  max_generations:
    value: 350
  tournament_k:
    value: 2
  tournament_opponents:
    value: 10
  use_neat:
    value: true
  curriculum_stage:
    value: 0
  checkmate_bonus:
    value: 15
  input_size:
    value: 389
  output_size:
    value: 384
  max_moves_per_game:
    value: 100
  eval_temperature:
    value: 0.0
  benchmark_size:
    value: 50
  draw_bonus:
    value: 1.5
  sf_fitness_weight:
    value: 0.0
  sf_fitness_top_n:
    value: 50
  sf_bench_interval:
    value: 5
  transition_gens:
    value: 3
  neat_initial_connections_per_output:
    value: 5
  neat_target_species_count:
    value: 5
  immigration_rate:
    value: 0.14
  crossover_rate:
    value: 0.76
  puzzle_accuracy_weight:
    value: 0.43

  # Swept — 4 params
  move_temperature:
    distribution: uniform
    min: 0.10
    max: 0.18
  neat_add_node_rate:
    distribution: uniform
    min: 0.15
    max: 0.25
  neat_add_connection_rate:
    distribution: uniform
    min: 0.18
    max: 0.28
  puzzle_advance_threshold:
    distribution: uniform
    min: 0.12
    max: 0.18
