# Optimized sweep v7 — start at stage 2 (opponent ladder)
#
# v6 (stage 1) had 92% of runs stuck — stage 1 exit (bench_wr >= 0.15
# for 3 consecutive gens) is hard to reach against weak random opponents.
#
# v2's best runs all jumped straight to stage 2 on gen 1. Replicate that
# by starting at curriculum_stage=2 (opponent ladder with benchmark).
#
# Also revert to conns=1 — v2's best runs used conns=1 and outperformed
# v6's conns=5. Simpler initial topology evolves faster.

method: bayes
metric:
  name: bench_avg_win_rate
  goal: maximize
parameters:
  population_size:
    value: 150
  hidden_size:
    value: 64
  games_per_individual:
    value: 2
  mutation_rate:
    value: 0.25
  mutation_strength:
    value: 0.12
  max_generations:
    value: 250
  tournament_k:
    value: 2
  tournament_opponents:
    value: 10
  use_neat:
    value: true
  curriculum_stage:
    value: 2
  checkmate_bonus:
    value: 15
  input_size:
    value: 389
  output_size:
    value: 384
  max_moves_per_game:
    value: 100
  eval_temperature:
    value: 0.0
  benchmark_size:
    value: 50
  draw_bonus:
    value: 1.5
  sf_fitness_weight:
    value: 0.0
  sf_fitness_top_n:
    value: 50
  sf_bench_interval:
    value: 5
  transition_gens:
    value: 3
  neat_initial_connections_per_output:
    value: 1
  neat_target_species_count:
    value: 5
  immigration_rate:
    value: 0.14
  crossover_rate:
    value: 0.76

  # Swept
  move_temperature:
    distribution: uniform
    min: 0.10
    max: 0.18
  neat_add_node_rate:
    distribution: uniform
    min: 0.15
    max: 0.25
  neat_add_connection_rate:
    distribution: uniform
    min: 0.18
    max: 0.28
