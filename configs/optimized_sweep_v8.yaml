# Optimized sweep v8 — follow-up to v7 (fblnme2z)
#
# v7 analysis (171 runs): topology mutation rates had ~no signal
# (corr add_node=-0.09, add_conn=+0.10). move_temperature was the only
# meaningful knob (corr +0.24) but was sampled on a narrow range [0.10, 0.18].
# Best run: 0.364 bench_avg_win_rate — modest. Suggests the current knobs
# are near-saturated and the bottleneck is elsewhere.
#
# Changes vs v7:
#   - Fix neat topology rates at top-cluster values (add_node=0.17, add_conn=0.25)
#   - Widen move_temperature to [0.10, 0.40]
#   - Sweep sf_fitness_weight (Stockfish shaping was off in v7) as a new bottleneck
#   - Sweep tournament_k to probe selection pressure
#   - Add hyperband early termination to kill clearly-bad runs early

method: bayes
metric:
  name: bench_avg_win_rate
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 60
  eta: 3

parameters:
  # Fixed (carried from v7)
  population_size:
    value: 150
  hidden_size:
    value: 64
  games_per_individual:
    value: 2
  mutation_rate:
    value: 0.25
  mutation_strength:
    value: 0.12
  max_generations:
    value: 250
  tournament_opponents:
    value: 10
  use_neat:
    value: true
  curriculum_stage:
    value: 2
  checkmate_bonus:
    value: 15
  input_size:
    value: 389
  output_size:
    value: 384
  max_moves_per_game:
    value: 100
  eval_temperature:
    value: 0.0
  benchmark_size:
    value: 50
  draw_bonus:
    value: 1.5
  sf_fitness_top_n:
    value: 50
  sf_bench_interval:
    value: 5
  transition_gens:
    value: 3
  neat_initial_connections_per_output:
    value: 1
  neat_target_species_count:
    value: 5
  immigration_rate:
    value: 0.14
  crossover_rate:
    value: 0.76

  # Fixed at v7 top-cluster values (were noise dimensions)
  neat_add_node_rate:
    value: 0.17
  neat_add_connection_rate:
    value: 0.25

  # Swept — widened on the one signal-bearing knob from v7
  move_temperature:
    distribution: uniform
    min: 0.10
    max: 0.40

  # Swept — new dimensions to probe a different bottleneck
  sf_fitness_weight:
    distribution: uniform
    min: 0.0
    max: 0.30
  tournament_k:
    values: [2, 3, 5]
