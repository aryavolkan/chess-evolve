# Optimized sweep based on analysis of 81 runs across v4ebn0dk + svo2gdlr
#
# Fixed (strong signal from data):
#   - population_size=150 (r=+0.82, 150 dominates)
#   - hidden_size=64 (r=+0.57)
#   - games_per_individual=2 (r=-0.51, more gens > more games)
#   - mutation_rate=0.25, mutation_strength=0.12 (low mutation sweet spot)
#   - max_generations=500 (10 gens doesn't converge)
#   - tournament_k=2, tournament_opponents=5 (consistently best)
#   - use_neat=true, curriculum_stage=0, checkmate_bonus=15
#
# Sweeping (uncertain / room to explore):
#   - crossover_rate: 0.58-0.80 (top runs span this range)
#   - immigration_rate: 0.10-0.18 (moderate positive signal)
#   - move_temperature: 0.05-0.20 (best run used 0.1)
#   - neat topology rates: best run had ~0.19 each
#   - neat_target_species_count: 5 vs 8 (best run used 8)
#   - puzzle_accuracy_weight: 0.3-0.5 (best run 0.36)

method: bayes
metric:
  name: bench_avg_win_rate
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 100
parameters:
  # Fixed — strong signal
  population_size:
    value: 150
  hidden_size:
    value: 64
  games_per_individual:
    value: 2
  mutation_rate:
    value: 0.25
  mutation_strength:
    value: 0.12
  max_generations:
    value: 500
  tournament_k:
    value: 2
  tournament_opponents:
    value: 5
  use_neat:
    value: true
  curriculum_stage:
    value: 0
  checkmate_bonus:
    value: 15
  input_size:
    value: 389
  output_size:
    value: 384
  max_moves_per_game:
    value: 100
  eval_temperature:
    value: 0.0
  benchmark_size:
    value: 50
  draw_bonus:
    value: 1.5
  sf_fitness_weight:
    value: 0.0
  sf_fitness_top_n:
    value: 50
  sf_bench_interval:
    value: 10
  transition_gens:
    value: 3
  neat_initial_connections_per_output:
    value: 1

  # Swept — uncertain / room to explore
  crossover_rate:
    distribution: uniform
    min: 0.58
    max: 0.80
  immigration_rate:
    distribution: uniform
    min: 0.10
    max: 0.18
  move_temperature:
    distribution: uniform
    min: 0.05
    max: 0.20
  neat_add_node_rate:
    distribution: uniform
    min: 0.12
    max: 0.25
  neat_add_connection_rate:
    distribution: uniform
    min: 0.15
    max: 0.30
  neat_target_species_count:
    values: [5, 8, 10]
  puzzle_accuracy_weight:
    distribution: uniform
    min: 0.30
    max: 0.50
  puzzle_advance_threshold:
    distribution: uniform
    min: 0.55
    max: 0.75
