# Optimized sweep v6 — skip stage 0 (puzzle stage is counterproductive)
#
# Key insight: the best-ever runs (v2 sweep, bwr=45%) all skipped stage 0
# by getting lucky on the first puzzle benchmark check. Stage 0 is a dead
# end — NEAT networks with random weights cannot learn chess tactics from
# puzzles alone. Starting at stage 1 (guided play vs random opponents)
# gives immediate game-based fitness signal.
#
# All Phase 1-3 fixes active. Starting at curriculum_stage=1.

method: bayes
metric:
  name: bench_avg_win_rate
  goal: maximize
parameters:
  # Fixed
  population_size:
    value: 150
  hidden_size:
    value: 64
  games_per_individual:
    value: 2
  mutation_rate:
    value: 0.25
  mutation_strength:
    value: 0.12
  max_generations:
    value: 350
  tournament_k:
    value: 2
  tournament_opponents:
    value: 10
  use_neat:
    value: true
  curriculum_stage:
    value: 1
  checkmate_bonus:
    value: 15
  input_size:
    value: 389
  output_size:
    value: 384
  max_moves_per_game:
    value: 100
  eval_temperature:
    value: 0.0
  benchmark_size:
    value: 50
  draw_bonus:
    value: 1.5
  sf_fitness_weight:
    value: 0.0
  sf_fitness_top_n:
    value: 50
  sf_bench_interval:
    value: 5
  transition_gens:
    value: 3
  neat_initial_connections_per_output:
    value: 5
  neat_target_species_count:
    value: 5
  immigration_rate:
    value: 0.14
  crossover_rate:
    value: 0.76

  # Swept — 4 params
  move_temperature:
    distribution: uniform
    min: 0.10
    max: 0.18
  neat_add_node_rate:
    distribution: uniform
    min: 0.15
    max: 0.25
  neat_add_connection_rate:
    distribution: uniform
    min: 0.18
    max: 0.28
  puzzle_advance_threshold:
    distribution: uniform
    min: 0.12
    max: 0.18
