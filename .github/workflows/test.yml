name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Create venv
        run: python -m venv .venv
      
      - name: Install dependencies
        run: .venv/bin/pip install pytest wandb
      
      - name: Run Python tests
        run: .venv/bin/python -m pytest tests/python/ tests/integration/ -v --ignore=tests/python/test_wandb_bridge.py

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build
        run: cargo build --manifest-path rust/chess-native/Cargo.toml --verbose
      
      - name: Run tests
        run: cargo test --manifest-path rust/chess-native/Cargo.toml --verbose

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install linters
        run: pip install ruff black
      
      - name: Run ruff
        run: ruff check .
        continue-on-error: true
      
      - name: Run black
        run: black --check .
        continue-on-error: true

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run clippy
        run: cargo clippy --manifest-path rust/chess-native/Cargo.toml --all-targets
        continue-on-error: true
      
      - name: Run fmt
        run: cargo fmt --manifest-path rust/chess-native/Cargo.toml -- --check
        continue-on-error: true
