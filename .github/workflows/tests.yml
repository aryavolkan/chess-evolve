name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Python lint (ruff)
        run: |
          pip3 install --quiet --break-system-packages ruff
          ruff check scripts/ train_wandb.py sweep_config.py || true

      - name: GDScript lint (gdlint)
        run: |
          pip3 install --quiet --break-system-packages gdtoolkit
          gdlint ai/*.gd chess/*.gd scenes/*.gd ui/*.gd benchmark_network.gd benchmark_network_sizes.gd || true

  python-tests:
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Run pytest
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pytest
          .venv/bin/python -m pytest tests/python -q

  godot-tests:
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Build Rust GDExtension
        run: cargo build
        working-directory: rust/chess-native

      - name: Import assets (headless)
        run: /opt/homebrew/bin/godot --headless --editor --quit --path . || true

      - name: Run tests
        run: /opt/homebrew/bin/godot --headless --path . -s test/test_runner.gd
