name: PR Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run Python lint and tests
        run: ./scripts/lint_python.sh

  gdscript-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDScript tooling
        run: |
          python -m pip install --upgrade pip
          pip install gdtoolkit

      - name: Run GDScript lint
        run: ./scripts/lint_gdscript.sh
