name: PR Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Rust GDExtension (required for artifact tests)
        run: cargo build --release
        working-directory: rust/chess-native

      - name: Install Python tooling
        run: pip3 install --quiet --break-system-packages pytest ruff

      - name: Run Python lint and tests
        run: |
          ruff check python/ scripts/ configs/ train_wandb.py || true
          pytest tests/python/ -v --ignore=tests/python/test_wandb_bridge.py || true

  gdscript-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GDScript tooling
        run: pip3 install --quiet --break-system-packages gdtoolkit

      - name: Run GDScript lint
        run: ./scripts/lint_gdscript.sh
