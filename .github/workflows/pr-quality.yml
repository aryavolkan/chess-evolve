name: PR Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff "gdtoolkit==4.*"

      - name: Run linters and tests
        run: ./scripts/lint_and_test.sh
