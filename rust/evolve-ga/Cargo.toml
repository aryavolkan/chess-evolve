[package]
name = "evolve-ga"
version = "0.1.0"
edition = "2021"
description = "High-performance genetic algorithm operators for chess neuroevolution"

[lib]
name = "evolve_ga"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rand = "0.8"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
