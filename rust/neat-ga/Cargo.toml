[package]
name = "neat-ga"
version = "0.1.0"
edition = "2021"
description = "NEAT (NeuroEvolution of Augmenting Topologies) for chess neuroevolution"

[lib]
name = "neat_ga"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
