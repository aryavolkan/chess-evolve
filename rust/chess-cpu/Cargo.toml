[package]
name = "chess-cpu"
version = "0.1.0"
edition = "2021"
description = "Python-callable chess game simulator for CPU-based neuroevolution training"

[lib]
name = "chess_cpu"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
rayon = "1.10"
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
