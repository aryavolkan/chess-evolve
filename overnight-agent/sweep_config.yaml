program: chess_sweep_worker.py
method: bayes
metric:
  name: best_fitness
  goal: maximize

parameters:
  population_size:
    values: [20, 50, 100]

  mutation_rate:
    distribution: uniform
    min: 0.05
    max: 0.30

  mutation_strength:
    distribution: uniform
    min: 0.10
    max: 0.50

  crossover_rate:
    distribution: uniform
    min: 0.50
    max: 0.90

  max_generations:
    value: 50

  games_per_individual:
    values: [3, 5, 10]

  hidden_size:
    values: [32, 64, 128]

  elite_count:
    values: [2, 3, 5]

  use_tournament:
    value: true

  tournament_opponents:
    values: [3, 5, 7]

  tournament_mode:
    values: [round_robin, swiss]

  species_target:
    values: [3, 5, 8]

  compatibility_threshold:
    distribution: uniform
    min: 2.0
    max: 5.0
