program: train_wandb.py
method: bayes
metric:
  name: best_fitness
  goal: maximize

parameters:
  population_size:
    values: [20, 30, 50]
  
  hidden_size:
    values: [32, 64, 128]
  
  elite_count:
    min: 2
    max: 10
  
  games_per_individual:
    values: [2, 3, 5]
  
  max_moves_per_game:
    values: [80, 100, 150]
  
  mutation_rate:
    min: 0.05
    max: 0.30
  
  mutation_strength:
    min: 0.1
    max: 0.5
  
  max_generations:
    value: 50

early_terminate:
  type: hyperband
  min_iter: 10
