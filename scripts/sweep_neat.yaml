program: train_wandb.py
method: bayes
metric:
  name: combined_best
  goal: maximize

parameters:
  use_neat:
    value: true

  neat_add_node_rate:
    distribution: uniform
    min: 0.05
    max: 0.30

  neat_add_connection_rate:
    distribution: uniform
    min: 0.10
    max: 0.40

  neat_initial_connections_per_output:
    value: 5

  neat_target_species_count:
    values: [3, 5, 8]

  population_size:
    values: [30, 50]

  tournament_opponents:
    values: [3, 5]

  max_generations:
    value: 50

  use_tournament:
    value: true

  tournament_mode:
    value: round_robin

early_terminate:
  type: hyperband
  min_iter: 10
