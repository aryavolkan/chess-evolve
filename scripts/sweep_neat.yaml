program: train_wandb.py
method: bayes
metric:
  name: bench_white_win_rate
  goal: maximize

parameters:
  # Fixed: NEAT mode with factored 128-output decode
  use_neat:
    value: true
  input_size:
    value: 389
  output_size:
    value: 128
  max_generations:
    value: 200
  max_moves_per_game:
    value: 100
  initial_connections_per_output:
    value: 1

  # Population & selection
  population_size:
    values: [100, 200, 300]
  tournament_opponents:
    values: [5, 8, 12]
  elite_fraction:
    distribution: uniform
    min: 0.05
    max: 0.20
  survival_fraction:
    distribution: uniform
    min: 0.30
    max: 0.60

  # Topology mutation rates
  add_node_rate:
    distribution: uniform
    min: 0.10
    max: 0.40
  add_connection_rate:
    distribution: uniform
    min: 0.20
    max: 0.60
  add_node_count:
    values: [1, 2]
  add_connection_count:
    values: [1, 3, 5]

  # Weight mutation
  weight_mutate_rate:
    distribution: uniform
    min: 0.60
    max: 0.95
  weight_perturb_strength:
    distribution: uniform
    min: 0.2
    max: 0.8
  crossover_rate:
    distribution: uniform
    min: 0.50
    max: 0.85

  # Species
  target_species_count:
    values: [5, 10, 15]
  stagnation_threshold:
    values: [10, 15, 25]
  threshold_step:
    distribution: uniform
    min: 0.05
    max: 0.20

  # Benchmark blending (key innovation)
  benchmark_fitness_weight:
    distribution: uniform
    min: 0.15
    max: 0.50

  # Move selection
  move_temperature:
    distribution: uniform
    min: 0.2
    max: 1.0

  # Mercy rule
  mercy_min_moves:
    value: 30
  mercy_material_threshold:
    value: 20.0

early_terminate:
  type: hyperband
  min_iter: 50
